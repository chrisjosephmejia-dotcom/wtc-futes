name: One-time Strategy Signals research audit
on:
  push:
    branches: [wtc-strategy-signals]
    paths:
      - ".github/workflows/strategy-signals-research-audit.yml"

permissions:
  contents: write

jobs:
  retrieve-summary:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Wait for Netlify to publish the matching branch
        run: sleep 25
      - name: Fetch sanitized public research diagnostic
        shell: bash
        run: |
          mkdir -p diagnostics
          python3 - <<'PY'
          import json, urllib.request, pathlib
          url="https://wtc-strategy-signals.netlify.app/api/model-audit"
          data={"status":"request_failed"}
          try:
              request=urllib.request.Request(url,headers={"User-Agent":"WTC-Strategy-Audit/1.0","Accept":"application/json"})
              with urllib.request.urlopen(request,timeout=25) as resp:
                  data=json.load(resp)
          except Exception as e:
              data={"status":"request_failed","reason":type(e).__name__}
          p=pathlib.Path("diagnostics/model-audit.json")
          p.write_text(json.dumps(data,indent=2,sort_keys=True)+"\n")
          print("status:",data.get("status"))
          print("snapshot written:",p)
          PY
      - name: Commit diagnostic report to this research branch only
        shell: bash
        run: |
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add diagnostics/model-audit.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record sanitized Strategy Signals public source audit"
          git push origin HEAD:wtc-strategy-signals
