name: Diagnose production NQ feed
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  diagnostic:
    runs-on: ubuntu-latest
    steps:
      - name: Check quote and trade coverage in production
        run: |
          python3 - <<'PY'
          import json, urllib.request, datetime, time
          time.sleep(18)
          base="https://wtc-futes.netlify.app"
          print("CHECKED_AT",datetime.datetime.now(datetime.timezone.utc).isoformat(),flush=True)
          for path in ("status","live-price","nq-trades-probe?lookbackMinutes=90"):
            try:
              req=urllib.request.Request(f"{base}/api/{path}",headers={"Cache-Control":"no-cache","User-Agent":"wtc-diagnostics/1.1"})
              with urllib.request.urlopen(req,timeout=25) as res:
                x=json.loads(res.read())
                if path=="status":
                  m=x.get("market") or {}
                  out={"status":x.get("signal"),"reason":x.get("reason"),"lastBar":m.get("lastBar"),"ageSec":m.get("ageSec"),"feedActive":m.get("feedActive")}
                elif path=="live-price":
                  out={k:x.get(k) for k in ("verified","price","quoteTime","ageSec","error")}
                else:
                  out={k:x.get(k) for k in ("ok","events","validTrades","earliest","latest","minuteCoverage","firstMinuteCounts","lastMinuteCounts","snapshotBoundaryAt","snapshotEvents","error")}
                print(path,"HTTP",res.status,json.dumps(out),flush=True)
            except Exception as e:print(path,"ERROR",str(e)[:400],flush=True)
          PY
