name: WTC V1 Historical Backtest

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/wtc-v1-backtest.yml'
      - 'research/wtc_v1_backtest.py'

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout WTC
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --upgrade pip pandas

      - name: Download public NQ 1-minute history
        run: |
          curl -L --fail --retry 3 --retry-delay 2 \
            'https://raw.githubusercontent.com/s-k-28/nq-es-trader-5k-payout/main/data/Dataset_NQ_1min_2022_2025.csv' \
            -o /tmp/Dataset_NQ_1min_2022_2025.csv
          ls -lh /tmp/Dataset_NQ_1min_2022_2025.csv
          head -n 2 /tmp/Dataset_NQ_1min_2022_2025.csv

      - name: Run frozen WTC V1 backtest
        run: |
          python research/wtc_v1_backtest.py \
            --csv /tmp/Dataset_NQ_1min_2022_2025.csv \
            --out wtc_v1_backtest_results.json \
            --trades wtc_v1_backtest_trades.csv

      - name: Upload backtest outputs
        uses: actions/upload-artifact@v4
        with:
          name: wtc-v1-backtest
          path: |
            wtc_v1_backtest_results.json
            wtc_v1_backtest_trades.csv
          retention-days: 90
