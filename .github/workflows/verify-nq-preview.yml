name: Verify NQ V4 candle recovery on deploy preview
on:
  push:
    branches: ['fix/nq-dt-all-candles-20261111']
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check the actual V4 computeSignal read-only endpoint
        run: |
          python3 - <<'PY'
          import urllib.request,urllib.error,json,time,datetime
          print("PREVIEW TEST UTC",datetime.datetime.now(datetime.timezone.utc).isoformat(),flush=True)
          time.sleep(20)
          u="https://deploy-preview-5--wtc-futes.netlify.app/api/nq-signal-test"
          for i in range(2):
            try:
              req=urllib.request.Request(u,headers={"Cache-Control":"no-cache","User-Agent":"wtc-preview-verify/1.0"})
              with urllib.request.urlopen(req,timeout=35) as res:
                obj=json.loads(res.read())
                m=obj.get("market") or {}
                c=m.get("sessionCoverage") or {}
                d=obj.get("daily") or {}
                print("ATTEMPT",i,"HTTP",res.status,json.dumps({"ok":obj.get("ok"),"error":obj.get("error"),"rawSignal":obj.get("signal"),"reason":obj.get("reason"),"lastBar":m.get("lastBar"),"ageSec":m.get("ageSec"),"feedActive":m.get("feedActive"),"sessionHistoryComplete":m.get("sessionHistoryComplete"),"coverage":c,"minutes":(obj.get("instrument") or {}).get("minuteBars"),"daily":d.get("state"),"score":obj.get("score")}),flush=True)
            except urllib.error.HTTPError as e:
              print("ATTEMPT",i,"ERROR HTTP",e.code,e.read().decode()[:600],flush=True)
            except Exception as e:
              print("ATTEMPT",i,"ERROR",str(e)[:500],flush=True)
            time.sleep(8)
          PY
