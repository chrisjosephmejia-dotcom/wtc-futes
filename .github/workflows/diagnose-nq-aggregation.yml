name: Probe NQ candle DXLink aggregation modes
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Compare candle timestamps from four DXLink symbol variants
        run: |
          python3 - <<'PY'
          import urllib.request, urllib.parse, json, datetime, time
          print("UTC NOW",datetime.datetime.now(datetime.timezone.utc).isoformat(),flush=True)
          # Allow the latest production deploy to publish before invoking endpoints.
          time.sleep(18)
          base="https://wtc-futes.netlify.app/api/nq-candles-test"
          cases=[("default",{}),("explicit_last",{"explicitLast":"1"}),("dt_all",{"dt":"all"}),("dt_all_week",{"dt":"all","lookbackMinutes":"10080"}),("dt_eth",{"dt":"eth"}),("dt_rth",{"dt":"rth"})]
          for name,extra in cases:
            p={"lookbackMinutes":"120","unit":"ms","contract":"HISTORY",**extra}
            url=base+"?"+urllib.parse.urlencode(p)
            try:
              req=urllib.request.Request(url,headers={"Cache-Control":"no-cache","User-Agent":"wtc-aggregates-check/1.0"})
              with urllib.request.urlopen(req,timeout=26) as response:
                j=json.loads(response.read())
                d=j.get("dxlink",{})
                cs=j.get("candles") or []
                last=cs[-1] if cs else {}
                print(name, json.dumps({"HTTP":response.status,"ok":j.get("ok"),"error":j.get("error"),"symbol":d.get("candleSymbol"),"ageSec":d.get("ageSec"),"count":d.get("usableCandles"),"last":last.get("time"),"lastClose":last.get("close"),"lastVolume":last.get("volume"),"snapshotComplete":d.get("snapshotComplete")}),flush=True)
            except Exception as e:print(name,"ERROR",str(e)[:280],flush=True)
          PY
