name: Verify live NQ feed after recovery
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify current OHLCV session continuity without trading
        run: |
          python3 - <<'PY'
          import urllib.request,urllib.error,json,time,datetime
          time.sleep(20)
          base="https://wtc-futes.netlify.app"
          print("VERIFIED_UTC",datetime.datetime.now(datetime.timezone.utc).isoformat(),flush=True)
          for iteration in range(2):
            for path in ["nq-signal-test","status","live-price"]:
              try:
                req=urllib.request.Request(f"{base}/api/{path}",headers={"Cache-Control":"no-cache","User-Agent":"wtc-recovery-verify/1.0"})
                with urllib.request.urlopen(req,timeout=40) as res:
                  obj=json.loads(res.read())
                  m=obj.get("market") or {}
                  c=m.get("sessionCoverage") or {}
                  o={"ok":obj.get("ok"),"error":obj.get("error"),"reason":obj.get("reason"),"signal":obj.get("signal"),"lastBar":m.get("lastBar"),"ageSec":m.get("ageSec"),"feedActive":m.get("feedActive"),"sessionHistoryComplete":m.get("sessionHistoryComplete"),"coverage":c,"minuteBars":(obj.get("instrument") or {}).get("minuteBars"),"daily":(obj.get("daily") or {}).get("state"),"price":obj.get("price"),"quoteTime":obj.get("quoteTime"),"verified":obj.get("verified")}
                  print("CHECK",iteration,path,"HTTP",res.status,json.dumps(o),flush=True)
              except urllib.error.HTTPError as e:
                print("CHECK",iteration,path,"HTTP_ERROR",e.code,e.read().decode()[:700],flush=True)
              except Exception as e:print("CHECK",iteration,path,"ERROR",str(e)[:500],flush=True)
            time.sleep(12)
          PY
