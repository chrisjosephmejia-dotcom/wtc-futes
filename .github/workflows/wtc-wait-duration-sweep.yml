name: WTC WAIT Duration Sweep

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/wtc-wait-duration-sweep.yml"

jobs:
  variant:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        wait: ["1", "3", "5", "10", "15", "30", "opposite"]
    steps:
      - name: Checkout WTC
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade pip pandas

      - name: Download public NQ 1-minute history
        run: |
          curl -L --fail --retry 3 --retry-delay 2 \
            'https://raw.githubusercontent.com/s-k-28/nq-es-trader-5k-payout/main/data/Dataset_NQ_1min_2022_2025.csv' \
            -o /tmp/Dataset_NQ_1min_2022_2025.csv

      - name: Build WAIT-duration variant from frozen V1
        env:
          WAIT_MODE: ${{ matrix.wait }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import os

          mode = os.environ['WAIT_MODE']
          src = Path('research/wtc_v1_backtest.py').read_text()
          src = src.replace(
              '    trades, open_trade = [], None\n',
              '    trades, open_trade = [], None\n    wait_streak = 0\n',
              1,
          )

          start_marker = '        signal_counts[signal] += 1\n'
          end_marker = '\n\n    if open_trade is not None and last_session_price is not None:'
          start = src.index(start_marker)
          end = src.index(end_marker, start)

          lines = [
              '        signal_counts[signal] += 1',
              '        actionable = signal in ("BUY MNQ", "SELL MNQ")',
              '        if open_trade is not None:',
              '            if actionable and signal != open_trade["direction"]:',
              '                close_trade(open_trade, c, ts, signal, reason, trades)',
              '                open_trade = None',
              '                wait_streak = 0',
          ]
          if mode == 'opposite':
              lines += [
                  '            elif not actionable:',
                  '                pass',
                  '            else:',
                  '                wait_streak = 0',
              ]
          else:
              n = int(mode)
              lines += [
                  '            elif not actionable:',
                  '                wait_streak += 1',
                  f'                if wait_streak >= {n}:',
                  f'                    close_trade(open_trade, c, ts, signal, "{n} CONSECUTIVE WAIT MINUTES · " + reason, trades)',
                  '                    open_trade = None',
                  '                    wait_streak = 0',
                  '            else:',
                  '                wait_streak = 0',
              ]
          lines += [
              '        if actionable and open_trade is None:',
              '            open_trade = {',
              '                "direction": signal, "opened_at": ts, "entry_price": c,',
              '                "entry_score": score, "entry_reason": reason,',
              '                "alignment": f"{t30.state}/{t15.state}/{t5.state}/{t1.state}",',
              '                "daily_state": dstate["state"],',
              '            }',
              '            wait_streak = 0',
          ]
          src = src[:start] + "\n".join(lines) + "\n" + src[end:]

          label = 'Opposite Signal Only' if mode == 'opposite' else f'{mode}-WAIT Hysteresis'
          lifecycle = (
              'same V1 entries; ignore WAIT and exit only on opposite signal or CME session close; no fixed stop/target; 1 MNQ'
              if mode == 'opposite'
              else f'same V1 entries; exit after {mode} consecutive WAIT minutes, immediate opposite signal, or CME session close; no fixed stop/target; 1 MNQ'
          )
          src = src.replace(
              '"strategy": "WTC MNQ Signal Engine V1"',
              f'"strategy": "WTC MNQ Shadow — {label}"',
              1,
          )
          src = src.replace(
              '"trade_lifecycle": "signal-to-signal; no fixed stop/target; 1 MNQ; WAIT/reversal/session close exits"',
              f'"trade_lifecycle": "{lifecycle}"',
              1,
          )
          Path('/tmp/wtc_wait_variant.py').write_text(src)
          PY

      - name: Run variant backtest
        env:
          WAIT_MODE: ${{ matrix.wait }}
        run: |
          python /tmp/wtc_wait_variant.py \
            --csv /tmp/Dataset_NQ_1min_2022_2025.csv \
            --out "wait_${WAIT_MODE}_results.json" \
            --trades "wait_${WAIT_MODE}_trades.csv"

      - name: Add Robinhood Gold fee economics
        env:
          WAIT_MODE: ${{ matrix.wait }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          mode = os.environ['WAIT_MODE']
          p = Path(f'wait_{mode}_results.json')
          d = json.loads(p.read_text())
          n = d['all_time']['trades']
          gross = d['all_time']['theoretical_pnl_1_mnq']
          rt = 1.72
          d['wait_mode'] = mode
          d['robinhood_gold_fee_model'] = {
              'fee_per_side_per_contract': 0.86,
              'round_trip_per_trade': rt,
              'total_round_trip_fees': round(n * rt, 2),
              'net_after_fees_before_slippage': round(gross - n * rt, 2),
              'avg_net_per_trade_before_slippage': round((gross - n * rt) / n, 4) if n else None,
          }
          p.write_text(json.dumps(d, indent=2))
          print('WTC_WAIT_VARIANT_RESULT')
          print(json.dumps({
              'wait_mode': mode,
              'trades': n,
              'gross_pnl': gross,
              'win_rate_pct': d['all_time']['win_rate_pct'],
              'avg_gross_trade': d['all_time']['avg_trade_pnl'],
              'profit_factor': d['all_time']['profit_factor'],
              'max_drawdown': d['all_time']['max_closed_trade_drawdown'],
              'median_duration_min': d['all_time']['median_duration_minutes'],
              'fees': d['robinhood_gold_fee_model']['total_round_trip_fees'],
              'net_after_fees_before_slippage': d['robinhood_gold_fee_model']['net_after_fees_before_slippage'],
          }))
          PY

      - name: Upload variant result
        uses: actions/upload-artifact@v4
        with:
          name: wait-${{ matrix.wait }}
          path: wait_${{ matrix.wait }}_results.json
          retention-days: 90

  aggregate:
    needs: variant
    runs-on: ubuntu-latest
    steps:
      - name: Download all variant results
        uses: actions/download-artifact@v4
        with:
          pattern: wait-*
          merge-multiple: true

      - name: Build sweep summary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          def sort_key(d):
              m = d['wait_mode']
              return 10**9 if m == 'opposite' else int(m)

          rows = []
          for p in Path('.').glob('wait_*_results.json'):
              d = json.loads(p.read_text())
              a = d['all_time']
              f = d['robinhood_gold_fee_model']
              rows.append({
                  'wait_mode': d['wait_mode'],
                  'trades': a['trades'],
                  'gross_pnl_1_mnq': a['theoretical_pnl_1_mnq'],
                  'win_rate_pct': a['win_rate_pct'],
                  'avg_gross_trade': a['avg_trade_pnl'],
                  'profit_factor': a['profit_factor'],
                  'max_drawdown': a['max_closed_trade_drawdown'],
                  'median_duration_minutes': a['median_duration_minutes'],
                  'robinhood_fees_1_72_rt': f['total_round_trip_fees'],
                  'net_after_fees_before_slippage': f['net_after_fees_before_slippage'],
                  'avg_net_trade_before_slippage': f['avg_net_per_trade_before_slippage'],
                  'by_year': d['by_year'],
              })
          rows.sort(key=sort_key)
          out = {
              'strategy': 'WTC V1 entry logic — WAIT duration sweep',
              'fee_assumption': '$0.86 per side / $1.72 round trip on 1 MNQ',
              'slippage': 'excluded',
              'variants': rows,
          }
          Path('wtc_wait_duration_sweep.json').write_text(json.dumps(out, indent=2))
          print('WTC_WAIT_SWEEP_START')
          print(json.dumps(out, indent=2))
          print('WTC_WAIT_SWEEP_END')
          PY

      - name: Upload sweep summary
        uses: actions/upload-artifact@v4
        with:
          name: wtc-wait-duration-sweep
          path: wtc_wait_duration_sweep.json
          retention-days: 90
