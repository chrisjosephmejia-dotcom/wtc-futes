name: WTC Manual Best Windows + $200 Stop

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/wtc-manual-best-windows-stop200.yml"

jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout WTC
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade pip pandas

      - name: Download public NQ 1-minute history
        run: |
          curl -L --fail --retry 3 --retry-delay 2 \
            'https://raw.githubusercontent.com/s-k-28/nq-es-trader-5k-payout/main/data/Dataset_NQ_1min_2022_2025.csv' \
            -o /tmp/Dataset_NQ_1min_2022_2025.csv

      - name: Build current V2 score-zero baseline
        run: |
          python - <<'PY'
          from pathlib import Path

          src = Path('research/wtc_v1_backtest.py').read_text()
          start_marker = '        signal_counts[signal] += 1\n'
          end_marker = '\n\n    if open_trade is not None and last_session_price is not None:'
          start = src.index(start_marker)
          end = src.index(end_marker, start)

          lines = [
              '        signal_counts[signal] += 1',
              '        actionable = signal in ("BUY MNQ", "SELL MNQ")',
              '        if open_trade is not None:',
              '            opposite = ((open_trade["direction"] == "BUY MNQ" and signal == "SELL MNQ") or',
              '                        (open_trade["direction"] == "SELL MNQ" and signal == "BUY MNQ"))',
              '            should_exit = False',
              '            exit_reason = reason',
              '            if opposite:',
              '                should_exit = True',
              '                exit_reason = "OPPOSITE FULL SIGNAL · " + reason',
              '            elif open_trade["direction"] == "BUY MNQ" and score <= 0:',
              '                should_exit = True',
              '                exit_reason = f"LONG EXIT HYSTERESIS · SCORE {score} <= 0"',
              '            elif open_trade["direction"] == "SELL MNQ" and score >= 0:',
              '                should_exit = True',
              '                exit_reason = f"SHORT EXIT HYSTERESIS · SCORE {score} >= 0"',
              '            if should_exit:',
              '                close_trade(open_trade, c, ts, signal, exit_reason, trades)',
              '                open_trade = None',
              '        if actionable and open_trade is None:',
              '            open_trade = {',
              '                "direction": signal, "opened_at": ts, "entry_price": c,',
              '                "entry_score": score, "entry_reason": reason,',
              '                "alignment": f"{t30.state}/{t15.state}/{t5.state}/{t1.state}",',
              '                "daily_state": dstate["state"],',
              '            }',
          ]
          new_block = "\n".join(lines) + "\n"
          baseline = src[:start] + new_block + src[end:]
          baseline = baseline.replace('"strategy": "WTC MNQ Signal Engine V1"', '"strategy": "WTC V2 Score-0 Hysteresis Baseline"', 1)
          baseline = baseline.replace('"trade_lifecycle": "signal-to-signal; no fixed stop/target; 1 MNQ; WAIT/reversal/session close exits"', '"trade_lifecycle": "same V1 entries; ignore raw WAIT; long exit score <= 0; short exit score >= 0; opposite full signal reverses; session-close flatten; no fixed stop"', 1)
          Path('/tmp/wtc_score0.py').write_text(baseline)
          PY

      - name: Run current V2 baseline
        run: |
          python /tmp/wtc_score0.py \
            --csv /tmp/Dataset_NQ_1min_2022_2025.csv \
            --out score0_baseline.json \
            --trades score0_baseline_trades.csv

      - name: Simulate manual follow-along
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd

          RT_FEE = 1.72
          STOP_DOLLARS = 200.0
          DOLLARS_PER_POINT = 2.0
          STOP_POINTS = STOP_DOLLARS / DOLLARS_PER_POINT

          # Baseline V2 trades are the source of entry alerts. Manual follower only
          # accepts fresh V2 entries that occur in 17:00-23:00 CT or 08:00-11:00 CT.
          # If manually stopped, remain flat until the next distinct V2 baseline trade.
          trades = pd.read_csv('score0_baseline_trades.csv')
          bars = pd.read_csv('/tmp/Dataset_NQ_1min_2022_2025.csv')
          bars.columns = [str(c).strip().lower().replace(' ', '_') for c in bars.columns]
          dcol = 'datetime' if 'datetime' in bars.columns else ('timestamp_et' if 'timestamp_et' in bars.columns else bars.columns[0])
          bars['datetime'] = pd.to_datetime(bars[dcol], errors='coerce')
          bars = bars.dropna(subset=['datetime','open','high','low','close']).sort_values('datetime').drop_duplicates('datetime')
          bars = bars.set_index('datetime')

          for c in ['opened_at_et','closed_at_et']:
              trades[c] = pd.to_datetime(trades[c], errors='coerce')
          trades = trades.dropna(subset=['opened_at_et','closed_at_et'])

          # Dataset/backtest timestamps are US/Eastern local time. ET is one hour ahead of CT.
          # Thus CT 17:00-23:00 => ET 18:00-24:00; CT 08:00-11:00 => ET 09:00-12:00.
          def window_label(ts):
              h = ts.hour
              if 18 <= h < 24:
                  return 'evening_17_23_CT'
              if 9 <= h < 12:
                  return 'morning_08_11_CT'
              return None

          eligible = trades.copy()
          eligible['window'] = eligible['opened_at_et'].map(window_label)
          eligible = eligible[eligible['window'].notna()].copy().reset_index(drop=True)

          out_rows = []
          for _, t in eligible.iterrows():
              entry_t = t['opened_at_et']
              base_exit_t = t['closed_at_et']
              entry = float(t['entry_price'])
              base_exit = float(t['exit_price'])
              side = 1 if t['direction'] == 'BUY MNQ' else -1
              stop_px = entry - STOP_POINTS if side == 1 else entry + STOP_POINTS
              exit_t = base_exit_t
              exit_px = base_exit
              exit_reason = str(t['exit_reason'])
              stopped = False

              # Entry happens at the entry bar close, so start checking with later bars.
              path = bars.loc[(bars.index > entry_t) & (bars.index <= base_exit_t)]
              for ts, b in path.iterrows():
                  o, h, l = float(b['open']), float(b['high']), float(b['low'])
                  hit = (l <= stop_px) if side == 1 else (h >= stop_px)
                  if hit:
                      exit_t = ts
                      if side == 1:
                          exit_px = o if o < stop_px else stop_px
                      else:
                          exit_px = o if o > stop_px else stop_px
                      exit_reason = 'MANUAL $200 HARD STOP'
                      stopped = True
                      break

              points = (exit_px - entry) * side
              gross = points * DOLLARS_PER_POINT
              out_rows.append({
                  'direction': t['direction'],
                  'window': t['window'],
                  'opened_at_et': entry_t,
                  'closed_at_et': exit_t,
                  'entry_price': entry,
                  'exit_price': exit_px,
                  'entry_score': t['entry_score'],
                  'daily_state': t['daily_state'],
                  'exit_reason': exit_reason,
                  'stopped': stopped,
                  'points': points,
                  'gross_pnl': gross,
                  'net_pnl_before_slippage': gross - RT_FEE,
                  'duration_minutes': max(0.0, (exit_t-entry_t).total_seconds()/60.0),
                  'baseline_gross_pnl_same_trade': float(t['theoretical_pnl_1_mnq']),
              })

          manual = pd.DataFrame(out_rows)
          manual.to_csv('wtc_manual_best_windows_stop200_trades.csv', index=False)

          def stats(df, pnl_col='gross_pnl'):
              p = df[pnl_col].astype(float).tolist() if len(df) else []
              wins = [x for x in p if x > 0]
              losses = [x for x in p if x < 0]
              cum = peak = maxdd = 0.0
              streak = max_streak = 0
              for x in p:
                  cum += x
                  peak = max(peak, cum)
                  maxdd = max(maxdd, peak-cum)
                  if x < 0:
                      streak += 1
                      max_streak = max(max_streak, streak)
                  else:
                      streak = 0
              gross_win = sum(wins)
              gross_loss = -sum(losses)
              return {
                  'trades': len(df),
                  'wins': len(wins),
                  'losses': len(losses),
                  'win_rate_pct': round(100*len(wins)/len(df),2) if len(df) else None,
                  'gross_pnl': round(sum(p),2),
                  'fees': round(len(df)*RT_FEE,2),
                  'net_after_fees_before_slippage': round(sum(p)-len(df)*RT_FEE,2),
                  'avg_gross_trade': round(sum(p)/len(df),2) if len(df) else None,
                  'avg_win': round(sum(wins)/len(wins),2) if wins else None,
                  'avg_loss': round(sum(losses)/len(losses),2) if losses else None,
                  'profit_factor': round(gross_win/gross_loss,3) if gross_loss else None,
                  'max_closed_trade_drawdown': round(maxdd,2),
                  'max_losing_streak': max_streak,
                  'median_duration_minutes': round(float(df['duration_minutes'].median()),1) if len(df) else None,
                  'stop_hits': int(df['stopped'].sum()) if len(df) else 0,
              }

          # Same selected V2 trades without manual stop, for isolating the stop's effect.
          nostop = eligible.copy()
          nostop['gross_pnl'] = nostop['theoretical_pnl_1_mnq'].astype(float)
          nostop['duration_minutes'] = (nostop['closed_at_et']-nostop['opened_at_et']).dt.total_seconds()/60.0
          nostop['stopped'] = False

          result = {
              'rules': {
                  'source_strategy': 'WTC V2 score-zero hysteresis baseline',
                  'entry_filter_CT': ['17:00 <= entry < 23:00', '08:00 <= entry < 11:00'],
                  'entry_behavior': 'Only fresh baseline V2 entries in those windows are taken. If the manual stop hits, no re-entry until the next distinct V2 baseline trade.',
                  'exit_behavior': 'Otherwise follow the baseline V2 exit even if it occurs outside the entry window.',
                  'hard_stop': '$200 on 1 MNQ = 100 NQ points adverse from entry',
                  'stop_fill': '1-minute OHLC; gap through stop fills at worse bar open; same entry bar cannot trigger stop',
                  'fees': '$1.72 Robinhood Gold round trip',
                  'slippage': 'not modeled except gap-through-stop handling',
              },
              'full_v2_baseline': json.loads(Path('score0_baseline.json').read_text())['all_time'],
              'selected_windows_no_stop': stats(nostop),
              'selected_windows_stop200': stats(manual),
              'by_window_stop200': {w: stats(g.reset_index(drop=True)) for w,g in manual.groupby('window')},
              'by_year_stop200': {str(y): stats(g.reset_index(drop=True)) for y,g in manual.groupby(manual['opened_at_et'].dt.year)},
          }
          a = result['selected_windows_no_stop']
          b = result['selected_windows_stop200']
          result['stop200_delta_vs_same_windows_no_stop'] = {
              k: round(b[k]-a[k],4)
              for k in ['trades','wins','losses','win_rate_pct','gross_pnl','fees','net_after_fees_before_slippage','avg_gross_trade','avg_win','avg_loss','profit_factor','max_closed_trade_drawdown','max_losing_streak','median_duration_minutes','stop_hits']
              if isinstance(a.get(k),(int,float)) and isinstance(b.get(k),(int,float))
          }
          Path('wtc_manual_best_windows_stop200.json').write_text(json.dumps(result, indent=2, default=str))
          print('WTC_MANUAL_WINDOWS_RESULT_START')
          print(json.dumps(result, indent=2, default=str))
          print('WTC_MANUAL_WINDOWS_RESULT_END')
          PY

      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: wtc-manual-best-windows-stop200
          path: |
            wtc_manual_best_windows_stop200.json
            wtc_manual_best_windows_stop200_trades.csv
          retention-days: 90
