name: WTC V2 Wait3 Historical Backtest

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/wtc-v2-wait3-backtest.yml"

jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout WTC
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade pip pandas

      - name: Download public NQ 1-minute history
        run: |
          curl -L --fail --retry 3 --retry-delay 2 \
            'https://raw.githubusercontent.com/s-k-28/nq-es-trader-5k-payout/main/data/Dataset_NQ_1min_2022_2025.csv' \
            -o /tmp/Dataset_NQ_1min_2022_2025.csv

      - name: Build three-WAIT hysteresis variant from frozen V1
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('research/wtc_v1_backtest.py')
          src = p.read_text()

          src = src.replace(
              '    trades, open_trade = [], None\n',
              '    trades, open_trade = [], None\n    wait_streak = 0\n',
              1,
          )

          old_closed = '''        if not cme_session_open_et(ts):
              rows_closed += 1
              if open_trade is not None and last_session_price is not None:
                  close_trade(open_trade, last_session_price, last_session_ts, "WAIT", "CME SESSION CLOSED", trades)
                  open_trade = None
              continue
          '''
          new_closed = '''        if not cme_session_open_et(ts):
              rows_closed += 1
              if open_trade is not None and last_session_price is not None:
                  close_trade(open_trade, last_session_price, last_session_ts, "WAIT", "CME SESSION CLOSED", trades)
                  open_trade = None
                  wait_streak = 0
              continue
          '''
          if old_closed not in src:
              raise SystemExit('Could not patch closed-session lifecycle')
          src = src.replace(old_closed, new_closed, 1)

          old_roll = '''        if last_session_key is not None and key != last_session_key and open_trade is not None:
              close_trade(open_trade, last_session_price, last_session_ts, "WAIT", "CME SESSION CLOSED", trades)
              open_trade = None
          '''
          new_roll = '''        if last_session_key is not None and key != last_session_key and open_trade is not None:
              close_trade(open_trade, last_session_price, last_session_ts, "WAIT", "CME SESSION CLOSED", trades)
              open_trade = None
              wait_streak = 0
          '''
          if old_roll not in src:
              raise SystemExit('Could not patch session-roll lifecycle')
          src = src.replace(old_roll, new_roll, 1)

          old_lifecycle = '''        signal_counts[signal] += 1
              actionable = signal in ("BUY MNQ", "SELL MNQ")
              if open_trade is not None and (not actionable or signal != open_trade["direction"]):
                  close_trade(open_trade, c, ts, signal, reason, trades)
                  open_trade = None
              if actionable and open_trade is None:
                  open_trade = {
                      "direction": signal, "opened_at": ts, "entry_price": c,
                      "entry_score": score, "entry_reason": reason,
                      "alignment": f"{t30.state}/{t15.state}/{t5.state}/{t1.state}",
                      "daily_state": dstate["state"],
                  }
          '''
          # Dedent-sensitive literal above is awkward inside YAML; use exact smaller block.
          old_lifecycle = '''        signal_counts[signal] += 1
          actionable = signal in ("BUY MNQ", "SELL MNQ")
          if open_trade is not None and (not actionable or signal != open_trade["direction"]):
              close_trade(open_trade, c, ts, signal, reason, trades)
              open_trade = None
          if actionable and open_trade is None:
              open_trade = {
                  "direction": signal, "opened_at": ts, "entry_price": c,
                  "entry_score": score, "entry_reason": reason,
                  "alignment": f"{t30.state}/{t15.state}/{t5.state}/{t1.state}",
                  "daily_state": dstate["state"],
              }
          '''
          new_lifecycle = '''        signal_counts[signal] += 1
          actionable = signal in ("BUY MNQ", "SELL MNQ")
          if open_trade is not None:
              if actionable and signal != open_trade["direction"]:
                  close_trade(open_trade, c, ts, signal, reason, trades)
                  open_trade = None
                  wait_streak = 0
              elif not actionable:
                  wait_streak += 1
                  if wait_streak >= 3:
                      close_trade(open_trade, c, ts, signal, "3 CONSECUTIVE WAIT MINUTES · " + reason, trades)
                      open_trade = None
                      wait_streak = 0
              else:
                  wait_streak = 0
          if actionable and open_trade is None:
              open_trade = {
                  "direction": signal, "opened_at": ts, "entry_price": c,
                  "entry_score": score, "entry_reason": reason,
                  "alignment": f"{t30.state}/{t15.state}/{t5.state}/{t1.state}",
                  "daily_state": dstate["state"],
              }
              wait_streak = 0
          '''
          if old_lifecycle not in src:
              raise SystemExit('Could not patch trade lifecycle')
          src = src.replace(old_lifecycle, new_lifecycle, 1)

          src = src.replace('"strategy": "WTC MNQ Signal Engine V1"', '"strategy": "WTC MNQ Signal Engine V2 Shadow — 3-WAIT Hysteresis"', 1)
          src = src.replace(
              '"trade_lifecycle": "signal-to-signal; no fixed stop/target; 1 MNQ; WAIT/reversal/session close exits"',
              '"trade_lifecycle": "same V1 entries; exit after 3 consecutive WAIT minutes, immediate opposite signal, or CME session close; no fixed stop/target; 1 MNQ"',
              1,
          )

          Path('/tmp/wtc_v2_wait3.py').write_text(src)
          PY

      - name: Run V2 shadow backtest
        run: |
          python /tmp/wtc_v2_wait3.py \
            --csv /tmp/Dataset_NQ_1min_2022_2025.csv \
            --out wtc_v2_wait3_results.json \
            --trades wtc_v2_wait3_trades.csv

      - name: Add Robinhood Gold fee economics
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('wtc_v2_wait3_results.json')
          d = json.loads(p.read_text())
          n = d['all_time']['trades']
          gross = d['all_time']['theoretical_pnl_1_mnq']
          rt = 1.72
          d['robinhood_gold_fee_model'] = {
              'fee_per_side_per_contract': 0.86,
              'round_trip_per_trade': rt,
              'total_round_trip_fees': round(n * rt, 2),
              'net_after_fees_before_slippage': round(gross - n * rt, 2),
              'avg_net_per_trade_before_slippage': round((gross - n * rt) / n, 4) if n else None,
          }
          p.write_text(json.dumps(d, indent=2))
          print('WTC_V2_WAIT3_RESULT_START')
          print(json.dumps(d, indent=2))
          print('WTC_V2_WAIT3_RESULT_END')
          PY

      - name: Upload backtest outputs
        uses: actions/upload-artifact@v4
        with:
          name: wtc-v2-wait3-backtest
          path: |
            wtc_v2_wait3_results.json
            wtc_v2_wait3_trades.csv
          retention-days: 90
